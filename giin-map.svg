<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d2a6e"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <clipPath id="bounds">
      <rect width="1200" height="630"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- River curves (right side) - gentle S-curve flowing bottom-right to upper-right -->
  <g clip-path="url(#bounds)">
    <!-- stream 1 (leftmost, thinner) -->
    <path d="M 700 720 C 750 520 820 440 900 320 C 960 220 1010 140 1050 -30"
          fill="none" stroke="#5ab4d6" stroke-width="5" stroke-linecap="round" opacity="0.38"/>
    <!-- stream 2 (middle, thickest, brightest) -->
    <path d="M 820 720 C 870 520 940 440 1020 320 C 1080 220 1130 140 1160 -30"
          fill="none" stroke="#7dd4ef" stroke-width="9" stroke-linecap="round" opacity="0.60"/>
    <!-- stream 3 (rightmost, thinner, goes off edge) -->
    <path d="M 940 720 C 990 520 1060 440 1130 320 C 1180 240 1210 160 1230 30"
          fill="none" stroke="#5ab4d6" stroke-width="5" stroke-linecap="round" opacity="0.38"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="145" width="11" height="220" fill="#7dd4ef" rx="2"/>

  <!-- Main title -->
  <text x="118" y="255" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-weight="800" font-size="100" fill="#ffffff" letter-spacing="-2">加古川市議会</text>
  <text x="118" y="365" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-weight="800" font-size="100" fill="#ffffff" letter-spacing="-2">議員マップ</text>

  <!-- Divider -->
  <line x1="118" y1="405" x2="700" y2="405" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="118" y="452" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif" font-weight="400" font-size="32" fill="rgba(255,255,255,0.72)">公約・質問・委員会活動を、市民目線で見える化する。</text>

  <!-- URL -->
  <text x="118" y="555" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="22" fill="rgba(255,255,255,0.36)" letter-spacing="1">kakogawa-giin-map.com</text>
</svg>
